# DigitalOcean App Platform spec.
# Deploy:   doctl apps create --spec .do/app.yaml
# Then set the ANTHROPIC_API_KEY secret in the app's settings (or below).
name: interlinear
region: fra

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    # Public clone URL — works without linking GitHub to DigitalOcean, but
    # deploys must be triggered manually (doctl apps create-deployment <id>).
    # To get deploy-on-push, authorize the DO GitHub app and replace with:
    #   github:
    #     repo: katspaugh/interlinear.io
    #     branch: main
    #     deploy_on_push: true
    git:
      repo_clone_url: https://github.com/katspaugh/interlinear.io.git
      branch: main
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      # DO managed Postgres presents a self-signed CA; keep TLS on but skip
      # chain verification (the connection stays on DO's private network).
      - key: DATABASE_SSL
        value: no-verify
        scope: RUN_TIME
      - key: ANTHROPIC_API_KEY
        type: SECRET
        scope: RUN_TIME
      # Owner passphrase: required for adding/removing texts. Without it the
      # site is read-only for visitors except word lookups (see the daily cap).
      - key: ADMIN_TOKEN
        type: SECRET
        scope: RUN_TIME
      - key: GLOSS_MODEL
        value: claude-opus-5
        scope: RUN_TIME
      # For cheap bulk glossing, set these to an Anthropic-compatible
      # endpoint (e.g. DeepSeek) and its model + key:
      # - key: GLOSS_BASE_URL
      #   value: https://api.deepseek.com/anthropic
      # - key: GLOSS_MODEL
      #   value: <the provider's model id>
      # - key: GLOSS_API_KEY
      #   type: SECRET

databases:
  - name: db
    engine: PG
    production: false

domains:
  - domain: interlinear.cc
    type: PRIMARY
    zone: interlinear.cc
  - domain: www.interlinear.cc
    type: ALIAS
    zone: interlinear.cc
  # sutta.stream is the same app wearing its sutta skin: the server picks the
  # branding by Host header (see shared/src/sites.ts).
  - domain: sutta.stream
    type: ALIAS
    zone: sutta.stream
  - domain: www.sutta.stream
    type: ALIAS
    zone: sutta.stream

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Default (interlinear) branding: in production the server rewrites the
         title, description, favicon, and social tags per domain — see
         server/src/static.ts and shared/src/sites.ts. -->
    <meta
      name="description"
      content="Read any text in any language with an interlinear gloss above every word. Tap a word for a full dictionary entry: grammar, meanings, and etymology."
    />
    <link rel="icon" href="/favicon.ico" />
    <title>interlinear — read any text word by word</title>
    <!-- Browsers that ignore type="module" cannot run the app bundle at all
         (the Kindle's browser, old WebKit): they run this classic script
         instead and land on the plain-HTML version. ?full=1 opts out. -->
    <script nomodule>
      if (window.location.search.indexOf('full=') < 0) {
        window.location.replace('/lite' + window.location.pathname)
      }
    </script>
  </head>
  <body>
    <!-- Replaced by the app on mount. A browser new enough for modules but
         too old for the bundle never gets that far and keeps this notice,
         which is also the loading state on a slow connection. -->
    <div id="root">
      <div id="boot" style="font: 16px/1.5 Georgia, serif; padding: 40px 20px; text-align: center">
        <p>Loading the reader…</p>
        <p><a href="/lite">If nothing happens, open the lite version →</a></p>
      </div>
    </div>
    <script type="module">
      document.getElementById('boot')?.remove()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
